<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0A2540" />
        <meta name="description" content="AMBER — Offline SIGINT Forensic Platform" />
        <meta name="referrer" content="no-referrer" />
        <!--
            This application is strictly offline. No external CDNs, no analytics,
            no telemetry, no remote fonts. Classified case data must never leave
            the operator's workstation.
            Fonts fall back to the operating system's native sans-serif / monospace.
        -->
        <title>AMBER — SIGINT Intelligence Analyzer</title>
        <!-- Suppress a harmless Chromium DataCloneError when devtools is open -->
        <script>
            window.addEventListener("error", function (e) {
                if (
                    e.error instanceof DOMException &&
                    e.error.name === "DataCloneError" &&
                    e.message &&
                    e.message.includes("PerformanceServerTiming")
                ) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            }, true);
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
